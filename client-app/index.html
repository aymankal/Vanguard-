<style>
/* Layout: navy command rail with the shield, content field on the right; the up-chevron from the logo is the recurring motif. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --sunk:#e4eaf2; --line:#d0d9e5;
  --ink:#0a1628; --muted:#55627a; --accent:#3a5ff0; --accent2:#13b884; --accent-ink:#ffffff;
  --navy:#0a1628; --navy-2:#13233d; --on-navy:#e9f0fb; --on-navy-muted:#8fa3c4;
  --signal:#d98a10; --good:#13a173; --bad:#c9372c;
  --grad:linear-gradient(120deg,#5b7cfa 0%,#2bb3c9 55%,#2ad49a 100%);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070d18; --surface:#0f1828; --sunk:#0b1322; --line:#1f2c42;
  --ink:#e8eef7; --muted:#8f9cb3; --accent:#7d97ff; --accent2:#35e0a4; --accent-ink:#06101e;
  --navy:#040912; --navy-2:#0e1a2e; --on-navy:#e9f0fb; --on-navy-muted:#8193b3;
  --signal:#f2a640; --good:#35d494; --bad:#ff6b5f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#070d18; --surface:#0f1828; --sunk:#0b1322; --line:#1f2c42;
  --ink:#e8eef7; --muted:#8f9cb3; --accent:#7d97ff; --accent2:#35e0a4; --accent-ink:#06101e;
  --navy:#040912; --navy-2:#0e1a2e; --on-navy:#e9f0fb; --on-navy-muted:#8193b3;
  --signal:#f2a640; --good:#35d494; --bad:#ff6b5f; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(30px,5.2vw,58px);font-weight:800;line-height:1}
h2{font-size:clamp(20px,2.4vw,26px);font-weight:700;line-height:1.15}
h3{font-family:var(--f-body);font-size:16.5px;font-weight:700;letter-spacing:0}
p{margin:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:var(--accent)}
.eyebrow::before{content:"";width:14px;height:9px;background:var(--grad);clip-path:polygon(0 100%,50% 0,100% 100%,82% 100%,50% 38%,18% 100%)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;gap:26px;padding:26px 16px;overflow:hidden}

.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand img{width:38px;height:auto}
.brand b{font-family:var(--f-display);font-size:16px;letter-spacing:.06em;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--on-navy-muted)}
nav{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:var(--r);color:var(--on-navy-muted);font-weight:600;font-size:14.5px}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{color:var(--on-navy);background:var(--navy-2)}
nav button[aria-current="page"]{color:var(--on-navy);background:var(--navy-2);box-shadow:inset 0 -2px 0 0 #2bb3c9}
nav button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail-foot{margin-top:auto;font-size:12.5px;color:var(--on-navy-muted);padding:0 6px;position:relative;z-index:1}
.rail-foot b{display:block;color:var(--on-navy);font-family:var(--f-display);font-size:13px;letter-spacing:.02em;margin-bottom:4px}

main{min-width:0;padding-block:32px 96px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.panel{display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:10px}
.head p{max-width:62ch;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:14.5px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=range]{padding:0;accent-color:var(--accent);border:0;background:none}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 26px 11px 18px;font-weight:700;font-size:14.5px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{padding:7px 20px 7px 12px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{all:unset;cursor:pointer;padding:7px 13px;border:1px solid var(--line);border-radius:var(--r);font-size:13.5px;background:var(--surface)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:var(--r);background:var(--sunk);color:var(--muted)}
.pill.good{color:var(--good)} .pill.warn{color:var(--signal)}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--signal);padding:6px 0 6px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* Home */
.hero{position:relative;overflow:hidden;background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:clamp(24px,5vw,52px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(135deg,transparent 0 22px,rgba(91,124,250,.06) 22px 23px),
  repeating-linear-gradient(45deg,transparent 0 22px,rgba(42,212,154,.05) 22px 23px);
  -webkit-mask:linear-gradient(90deg,transparent 30%,#000);mask:linear-gradient(90deg,transparent 30%,#000);pointer-events:none}
.hero > *{position:relative}
.hero .kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-navy-muted)}
.hero h1{margin-top:14px}
.hero p.lede{margin-top:16px;max-width:52ch;color:var(--on-navy-muted);font-size:16.5px}
.hero .ctas{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.ghost{background:var(--navy-2);color:var(--on-navy)}
.hero-mark{width:clamp(120px,18vw,200px);height:auto;filter:drop-shadow(0 18px 40px rgba(43,179,201,.35));animation:rise 1s ease-out both}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.price-tag{display:inline-flex;align-items:baseline;gap:10px;margin-top:22px;padding:10px 14px;border:1px solid rgba(143,163,196,.3);border-radius:var(--r)}
.price-tag b{font-family:var(--f-display);font-size:24px;color:#fff}
.price-tag span{font-size:13.5px;color:var(--on-navy-muted)}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border-top:1px solid var(--line)}
.svc{padding:20px 20px 20px 0;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.svc .n{font-family:var(--f-display);font-size:13px;color:var(--accent)}
.svc p{color:var(--muted);font-size:14.5px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile b{font-size:16px}
.tile span{font-size:14px;color:var(--muted)}
.tile .free{align-self:flex-start;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);border:1px solid currentColor;padding:1px 6px;border-radius:var(--r)}
.tile svg{width:22px;height:22px;color:var(--accent)}
.band{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px;border-radius:var(--r);background:var(--sunk)}
.band h3{font-family:var(--f-display);font-size:18px}

/* Chat */
.chat{display:flex;flex-direction:column;height:min(620px,calc(100vh - 220px));min-height:420px;padding:0;overflow:hidden}
.log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78ch;min-width:0}
.msg.me{align-self:flex-end;background:var(--navy);color:var(--on-navy);padding:10px 14px;border-radius:var(--r)}
.msg.ai{align-self:flex-start;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.msg.ai .who{width:28px}
.msg.ai .who img{width:24px;height:auto}
.compose{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;background:var(--surface)}
.compose textarea{min-height:44px;height:44px}
.md p+p,.md ul,.md ol{margin-top:8px}
.md ul,.md ol{padding-left:20px;margin-bottom:0}
.md h4{font-size:15px;margin:12px 0 4px}
.md code{font-family:var(--f-mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg.ai .actions{grid-column:2}
.out{background:var(--sunk);border-radius:var(--r);padding:16px;min-height:120px;white-space:normal;overflow-wrap:anywhere}

/* Quote */
.quote-total{font-family:var(--f-display);font-size:clamp(34px,5vw,46px);font-weight:800;line-height:1}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:var(--r);width:max-content}
.stepper button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;font-size:20px;color:var(--accent)}
.stepper button:hover{background:var(--sunk)}
.stepper output{min-width:46px;text-align:center;font-family:var(--f-display);font-size:18px}
.seat{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.seat small{display:block;color:var(--muted);font-weight:400}

/* Booking */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{all:unset;cursor:pointer;flex:none;width:64px;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.day small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase}
.day b{font-family:var(--f-display);font-size:19px}
.day[aria-pressed="true"],.slot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day[aria-pressed="true"] small{color:inherit}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{all:unset;cursor:pointer;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:var(--r);font-family:var(--f-mono);font-size:13px}
.day:focus-visible,.slot:focus-visible{outline:2px solid var(--accent)}

/* CRM */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col h3{font-size:13.5px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.deal b{font-size:14.5px}
.deal select{padding:4px 6px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{font-family:var(--f-display);font-size:22px;display:block}
.kpi span{font-size:12.5px;color:var(--muted)}

/* Quiz */
.meter{height:6px;background:var(--sunk);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);transition:width .3s}
.opt{all:unset;cursor:pointer;display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt.right{border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:13px}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.funnel i{display:block;height:22px;background:var(--grad);border-radius:2px;min-width:4px}
.funnel span{white-space:nowrap}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));z-index:20}
  .rail::after,.brand,.rail-foot{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;width:100%}
  nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 9px;flex:none}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-mark{grid-row:1;width:84px}
  main{padding-block:20px 110px}
  .chat{height:calc(100vh - 230px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "$" + Math.round(n).toLocaleString("en-US");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const store = { get(k,d){ try{ const v=localStorage.getItem("vg:"+k); return v?JSON.parse(v):d }catch{ return d } },
                set(k,v){ try{ localStorage.setItem("vg:"+k, JSON.stringify(v)) }catch{} } };
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.append(d); setTimeout(()=>d.remove(),2600) }
async function copy(text, btn){ try{ await navigator.clipboard.writeText(text); toast("Copied") }catch{ toast("Select the text and copy it manually") } }

function md(src){
  const lines = esc(src).split("\n"); let html="", list=null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/(^|\s)\*(\S.+?)\*/g,"$1<i>$2</i>");
  const close = () => { if(list){ html += `</${list}>`; list=null } };
  for(const l of lines){
    let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); html+=`<h4>${inline(m[1])}</h4>` }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){close(); html+="<ul>"; list="ul"} html+=`<li>${inline(m[1])}</li>` }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=="ol"){close(); html+="<ol>"; list="ol"} html+=`<li>${inline(m[1])}</li>` }
    else if(!l.trim()){ close() }
    else { close(); html+=`<p>${inline(l)}</p>` }
  }
  close(); return html;
}

const cap = { sample:null, db:null, user:null, uid:null, owner:false };
const ready = (async () => {
  if(!window.claude?.use) return;
  const [s,d,u] = await Promise.all([claude.use("sample"), claude.use("db"), claude.use("user")]);
  cap.sample=s; cap.db=d; cap.user=u;
  if(u){ try{ cap.uid = await u.id(); cap.owner = await u.isOwner() }catch{} }
  renderNav(); if(current==="inbox"||current==="crm") show(current);
})();

async function ask(prompt, onText, tier="default"){
  if(!cap.sample) throw {code:"not_granted", message:"AI is not available in this view. Open the hub signed in to claude.ai and allow AI access."};
  const input = typeof prompt==="string" ? prompt : prompt;
  const r = await cap.sample(input, { cache:false, modelTier:tier, onText: ({text}) => onText?.(text) });
  return r.text;
}
function aiError(e){ return e?.code==="rate_limited" ? "Too many requests right now. Wait a minute and try again." : (e?.message || "The AI request failed. Try again.") }

/* Requests (quotes, calls, consults) go to the Vanguard inbox */
async function submitRequest(kind, payload){
  const doc = { kind, ...payload, status:"new", createdAt:new Date().toISOString() };
  const mine = store.get("requests", []); mine.unshift(doc); store.set("requests", mine);
  if(cap.db && cap.uid){
    try{
      await cap.db.doc(`inbox/${cap.uid}`).set({ name:payload.name||"", email:payload.email||"", company:payload.company||"", lastAt:doc.createdAt });
      await cap.db.doc(`inbox/${cap.uid}/requests/${uid()}`).set(doc);
      return { saved:true };
    }catch(e){ return { saved:false, error:e } }
  }
  return { saved:false };
}
function requestSummary(kind, p){ return [`Vanguard request: ${kind}`, ...Object.entries(p).filter(([,v])=>v!==""&&v!=null).map(([k,v])=>`${k}: ${typeof v==="object"?JSON.stringify(v):v}`)].join("\n") }
function confirmBox(res, kind, p){
  const text = requestSummary(kind,p);
  if(res.saved) return `<div class="card stack"><span class="pill good">Request sent</span><h3>Thanks, ${esc(p.name||"")}. Vanguard has your ${esc(kind.toLowerCase())}.</h3><p class="muted">A specialist replies by email to <b>${esc(p.email)}</b>, usually within one business day.</p></div>`;
  return `<div class="card stack"><span class="pill warn">Not sent from this view</span><h3>Copy your request and send it to Vanguard</h3>

let chat = store.get("chat", []);
VIEWS.ask = v => {
  v.innerHTML = `<section class="panel">
    <div class="head"><span class="eyebrow">AI concierge</span><h2>Ask Vanguard</h2><p>Services, process, onboarding, pricing approach, tools. Answers come from Vanguard's own brief.</p></div>
    <div class="row" id="chips">${["What does an outsourced SDR team include?","How fast can you launch?","How do you report results?","Do you do customer support in Arabic?","Is it cheaper than hiring in-house?"].map(q=>`<button class="chip">${esc(q)}</button>`).join("")}</div>
    <div class="card chat"><div class="log" id="log"></div>
      <form class="compose" id="cf"><textarea id="cq" placeholder="Ask about Vanguard…" aria-label="Your question"></textarea><button class="btn" id="cs">Send</button></form></div>
    <div class="row"><button class="btn ghost small" id="clr">Clear conversation</button></div>
  </section>`;
  const log=$("#log",v);
  const ACT = {quote:["Get a quote","quote"],book:["Book a call","book"],plan:["Free plan consult","plan"],crm:["Open free CRM","crm"],copilot:["Open copilot","copilot"],quiz:["Take the SDR quiz","quiz"]};
  const bubble = (m) => {
    if(m.role==="user") return `<div class="msg me">${esc(m.content)}</div>`;
    const acts=[...new Set((m.content.match(/\[\[(\w+)\]\]/g)||[]).map(x=>x.slice(2,-2)))].filter(a=>ACT[a]);
    const body=m.content.replace(/\[\[\w+\]\]/g,"").trim();
    return `<div class="msg ai"><div class="who"><img src="${LOGO}" alt="Vanguard"></div><div class="md">${md(body)}</div>${acts.length?`<div class="actions">${acts.map(a=>`<button class="btn small" data-go="${ACT[a][1]}">${ACT[a][0]}</button>`).join("")}</div>`:""}</div>`;
  };
  const draw = () => { log.innerHTML = (chat.length?chat:[{role:"assistant",content:"Hi, I'm the Vanguard concierge. Ask me how our SDR, sales outsourcing or support teams work, or tell me about your business and I'll suggest a setup. [[quote]] [[book]]"}]).map(bubble).join(""); log.scrollTop=log.scrollHeight };
  draw();
  const send = async q => {
    q=q.trim(); if(!q) return; $("#cq",v).value="";
    chat.push({role:"user",content:q}); draw();
    const el=document.createElement("div"); el.className="msg ai"; el.innerHTML=`<div class="who"><img src="${LOGO}" alt="Vanguard"></div><div class="md muted">Thinking…</div>`; log.append(el); log.scrollTop=log.scrollHeight;
    const pre = `You are the client concierge for Vanguard Services SAL. Be direct, concise and helpful, like a senior account executive. Use short paragraphs or bullets. Ground every fact in this brief:\n${KB}\n\nWhen it helps the visitor, end with one or two action tags from: [[quote]] [[book]] [[plan]] [[crm]] [[copilot]] [[quiz]]. Tags render as buttons; don't explain them.\n\nVisitor's first message:\n`;
    const msgs = chat.slice(-12).map((m,i)=>({role:m.role==="user"?"user":"assistant",content:m.content}));
    if(msgs[0].role!=="user") msgs.shift();
    msgs[0] = {role:"user", content: pre + msgs[0].content};
    try{
      const t = await ask(msgs, text => { $(".md",el).classList.remove("muted"); $(".md",el).innerHTML = md(text.replace(/\[\[\w+\]\]/g,"")); log.scrollTop=log.scrollHeight });
      chat.push({role:"assistant",content:t}); store.set("chat",chat); draw();
    }catch(e){ $(".md",el).innerHTML = `<p style="color:var(--bad)">${esc(aiError(e))}</p>`; chat.pop(); }
  };
  $("#cf",v).addEventListener("submit", e => { e.preventDefault(); send($("#cq",v).value) });
  $("#cq",v).addEventListener("keydown", e => { if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send($("#cq",v).value) } });
  $("#chips",v).addEventListener("click", e => { const b=e.target.closest(".chip"); if(b) send(b.textContent) });
  $("#clr",v).onclick = () => { chat=[]; store.set("chat",chat); draw() };
};

    const ds=crm.deals, open=ds.filter(d=>!["Won","Lost"].includes(d.stage));
    const won=ds.filter(d=>d.stage==="Won"), lost=ds.filter(d=>d.stage==="Lost");
    $("#kpis",v).innerHTML = [[open.length,"open deals"],[fmt(open.reduce((a,d)=>a+(+d.value||0),0)),"open pipeline"],[fmt(won.reduce((a,d)=>a+(+d.value||0),0)),"won"],[(won.length+lost.length)?Math.round(100*won.length/(won.length+lost.length))+"%":"–","win rate"]].map(([b,s])=>`<div class="kpi"><b class="mono">${b}</b><span>${s}</span></div>`).join("");
    $("#board",v).innerHTML = STAGES.map(s=>{ const items=ds.filter(d=>d.stage===s); return `<div class="col"><h3>${s}<span class="pill">${items.length}</span></h3>${items.map(d=>`<div class="deal"><b>${esc(d.name)}</b><span class="muted">${esc(d.company||"")}</span>${d.value?`<span class="mono">${fmt(d.value)}</span>`:""}${d.next?`<span>→ ${esc(d.next)}</span>`:""}<div class="row" style="justify-content:space-between"><select data-id="${d.id}" aria-label="Stage">${STAGES.map(x=>`<option ${x===d.stage?"selected":""}>${x}</option>`).join("")}</select><button class="btn ghost small" data-del="${d.id}">Delete</button></div></div>`).join("")}</div>` }).join("");
  };
  const persistLocal = () => { if(!crm.remote) store.set("crm", crm.deals) };
  const write = async d => { const c=col(); if(c){ try{ await c.doc(d.id).set(d) }catch{ toast("Couldn't save to your account; saved in this browser"); crm.remote=false; persistLocal() } } else persistLocal() };
  const remove = async id => { const c=col(); if(c){ try{ await c.doc(id).delete() }catch{} } persistLocal() };
  if(col() && !crm.unsub){
    crm.unsub = col().orderBy("at","desc").onSnapshot(snap=>{ crm.remote=true; crm.deals=snap.docs.map(x=>({id:x.id,...x.data()})); if(current==="crm") draw() }, ()=>{ crm.remote=false });
  }
  draw();
  $("#df",v).addEventListener("submit", async e=>{ e.preventDefault();
    const d={id:uid(),name:$("#d_name",v).value,company:$("#d_co",v).value,email:$("#d_email",v).value,value:+$("#d_val",v).value||0,stage:$("#d_stage",v).value,next:$("#d_next",v).value,notes:$("#d_notes",v).value,at:Date.now()};
    if(!crm.remote) crm.deals.unshift(d); e.target.reset(); draw(); await write(d); toast("Deal added") });
  $("#board",v).addEventListener("change", async e=>{ const s=e.target.closest("select[data-id]"); if(!s) return; const d=crm.deals.find(x=>x.id===s.dataset.id); if(!d) return; d.stage=s.value; draw(); await write({...d}) });
  $("#board",v).addEventListener("click", async e=>{ const b=e.target.closest("[data-del]"); if(!b) return; crm.deals=crm.deals.filter(x=>x.id!==b.dataset.del); draw(); await remove(b.dataset.del) });
  $("#crmai",v).onclick = async () => { const out=$("#crmout",v); out.innerHTML=`<p class="muted">Reviewing…</p>`;
    const rows=crm.deals.map(d=>`- ${d.name} | ${d.company} | ${d.stage} | $${d.value} | next: ${d.next} | notes: ${d.notes}`).join("\n");
    try{ await ask(`You are a sales manager reviewing a small B2B pipeline. For each open deal give one concrete next action with a deadline, flag stalled deals, and finish with the 3 priorities for this week. Be brief. Pipeline:\n${rows}`, t=>out.innerHTML=md(t), "quick") }
    catch(err){ out.innerHTML=`<p style="color:var(--bad)">${esc(aiError(err))}</p>` } };
};

          <label>Stage<select id="p_stage"><option>Idea / pre-revenue</option><option>Early revenue (&lt;$500k)</option><option>Growing ($500k–$5M)</option><option>Scaling ($5M+)</option></select></label>

      <div class="stack"><div id="p_done"></div>
        <div class="card stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Your go-to-market draft</span><button class="btn ghost small" data-copy>Copy</button></div><div class="out md" id="po"><p class="muted">Fill in the form and your draft appears here: positioning, ICP, channels, sales team plan, 90-day milestones and KPIs.</p></div></div></div>
    </div></section>`;
  $("#pf",v).addEventListener("submit", async e=>{ e.preventDefault(); const g=id=>$("#"+id,v).value;
    const p={name:g("p_name"),email:g("p_email"),company:g("p_company"),industry:g("p_ind"),stage:g("p_stage"),market:g("p_mkt"),offer:g("p_what"),goal:g("p_goal"),challenge:g("p_ch")};

    try{ await ask(`You are a go-to-market strategist at Vanguard Services (outsourced SDR teams, sales outsourcing, customer support). Write a concise one-page go-to-market draft for this company with these sections: Positioning, Ideal Customer Profile, Channels and outbound motion, Sales team plan (in-house vs outsourced, with headcount), 90-day milestones, KPIs to track, Risks. Be specific and practical. Don't invent market statistics; mark assumptions as assumptions. End with 3 questions to discuss on the consult call.\n\nCompany: ${p.company}\nIndustry: ${p.industry}\nStage: ${p.stage}\nMarket: ${p.market}\nOffer: ${p.offer}\nGoal: ${p.goal}\nChallenge: ${p.challenge}`, t=>out.innerHTML=md(t), "complex") }
    catch(err){ out.innerHTML=`<p style="color:var(--bad)">${esc(aiError(err))}</p>` }
    $("#pb",v).disabled=false;
  });

/* SDR quiz */
const QUIZ = [
  {q:"Out of 100 cold dials, how many typically reach a live decision-maker?",o:["40–50","20–30","Under 10","About 60"],a:2,x:"Most dials hit voicemail, gatekeepers or wrong numbers. Single-digit connect rates are normal."},
  {q:"A typical reply rate on cold email to a well-built list is…",o:["15–25%","1–5%","30%+","10–15%"],a:1,x:"Low single digits is the norm. Volume, targeting and copy all have to be right."},
  {q:"How many touches does it usually take to book a meeting with a cold prospect?",o:["1–2","3–4","8 or more","Exactly 5"],a:2,x:"Meetings usually come after many touches across phone, email and LinkedIn. Most reps quit far earlier."},
  {q:"An inbound lead fills in your form. When should someone call?",o:["Within 5 minutes","Same day","Within 48 hours","Next weekly sync"],a:0,x:"Speed to lead is decisive. Qualification odds drop sharply after the first few minutes."},
  {q:"Roughly how much B2B contact data goes stale every year?",o:["Under 5%","About 10%","20–30%","None, if bought from a vendor"],a:2,x:"People change jobs, titles and emails constantly. Lists need constant re-verification."},
  {q:"How long does a new in-house SDR usually take to reach full productivity?",o:["1 week","About 3 months","1 year","They're productive on day one"],a:1,x:"Ramp time plus recruiting time means months before a new hire pays off."},
  {q:"The prospect says “Just send me an email.” The best move is to…",o:["Say thanks and hang up","Agree, then ask one question so the email is relevant and set a time to follow up","Push for a meeting anyway","Send a generic brochure"],a:1,x:"It's usually a brush-off. Earning one more answer turns it into a real next step."},
  {q:"An active phone-based SDR typically makes how many dials a day?",o:["10–20","50–100","300+","Only when leads come in"],a:1,x:"Consistent daily volume, every day, plus research, emails and CRM updates."},
  {q:"“We already work with someone for this.” Best first response?",o:["Offer a discount","Ask what they'd improve about the current setup","Argue your product is better","End the call"],a:1,x:"Curiosity beats pitching. Find the gap before you position against the incumbent."},
  {q:"Average SDR tenure in a role is roughly…",o:["5+ years","About 1.5 years","3 years","Over a decade"],a:1,x:"Short tenure means constant rehiring and re-ramping. This is where most in-house teams lose momentum."}
];
VIEWS.quiz = v => {
  let i=0, score=0, start=Date.now(), locked=false, timer;
  const finish = () => {
    clearInterval(timer); const secs=Math.round((Date.now()-start)/1000);
    const best=store.get("quizBest",0); if(score>best) store.set("quizBest",score);
    const verdict = score>=8 ? "You think like a seasoned SDR. Now imagine doing that 80 times a day." : score>=5 ? "Solid instincts. The gap between knowing and doing it daily is where teams win or lose." : "This is why outbound is hard, and why most in-house teams stall.";
    v.innerHTML = `<section class="panel"><div class="head"><span class="eyebrow">Result</span><h2 class="mono">${score} / ${QUIZ.length}</h2><p>${verdict}</p><p class="muted mono" style="font-size:12px">Finished in ${secs}s · Best ${Math.max(best,score)}/${QUIZ.length}</p></div>
      <div class="card stack"><h3>One SDR day, in numbers</h3><p class="muted">Illustrative, using typical benchmark ranges. Results vary by market and list quality.</p>
        <div class="funnel">${[[80,"dials"],[6,"live conversations"],[2,"qualified interest"],[1,"meeting booked"]].map(([n,l])=>`<div><i style="width:${Math.max(4,n/80*100)}%"></i><span class="mono">${n}</span><span>${l}</span></div>`).join("")}</div>
        <p>Every one of those dials needs research, a sharp opener, objection handling and a CRM update. Vanguard runs this daily, with trained reps, tested scripts and weekly reporting.</p>
        <div class="row"><button class="btn" data-go="quote">Price an SDR team</button><button class="btn ghost" data-go="book">Talk to us</button><button class="btn ghost" id="again">Try again</button></div></div></section>`;
    $("#again",v).onclick=()=>VIEWS.quiz(v);
  };
  const draw = () => {
    const it=QUIZ[i]; locked=false;
    v.innerHTML = `<section class="panel"><div class="head"><span class="eyebrow">SDR reality quiz</span><h2>Could you hit quota?</h2><p>Ten questions on lead gen and outbound. Most people get fewer than half right.</p></div>
      <div class="card stack"><div class="row" style="justify-content:space-between"><span class="mono">Question ${i+1} of ${QUIZ.length}</span><span class="timer" id="tm"></span></div>
        <div class="meter"><i style="width:${i/QUIZ.length*100}%"></i></div>
        <h3 style="font-size:19px">${esc(it.q)}</h3>
        <div class="stack" style="gap:8px" id="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
        <p id="ex" class="note" hidden></p>
        <div class="row" style="justify-content:space-between"><span class="mono muted">Score ${score}</span><button class="btn" id="nx" hidden>${i+1<QUIZ.length?"Next question":"See my result"}</button></div></div></section>`;
    $("#opts",v).onclick=e=>{ const b=e.target.closest(".opt"); if(!b||locked) return; locked=true; const k=+b.dataset.k;
      v.querySelectorAll(".opt").forEach((x,j)=>{ if(j===it.a) x.classList.add("right"); else if(j===k) x.classList.add("wrong") });
      if(k===it.a) score++; const ex=$("#ex",v); ex.textContent=(k===it.a?"Correct. ":"Not quite. ")+it.x; ex.hidden=false; $("#nx",v).hidden=false; $("#nx",v).focus() };
    $("#nx",v).onclick=()=>{ i++; i<QUIZ.length?draw():finish() };
  };
  timer=setInterval(()=>{ const t=$("#tm",v); if(t) t.textContent=Math.round((Date.now()-start)/1000)+"s"; else clearInterval(timer) },1000);
  draw();
};

/* Owner inbox */
VIEWS.inbox = async v => {
  v.innerHTML = `<section class="panel"><div class="head"><span class="eyebrow">Vanguard team only</span><h2>Inbox</h2><p>Quote requests, call bookings and consult requests from clients using the hub.</p></div><div class="card scroll" id="ib"><p class="muted">Loading requests…</p></div></section>`;
  await ready;
  const box=$("#ib",v);
  if(!cap.owner||!cap.db){ box.innerHTML=`<p class="muted">Only the hub's owner can see requests.</p>`; return }
  try{
    const people=(await cap.db.collection("inbox").get()).docs;
    const all=[];
    for(const p of people){ const rs=(await cap.db.collection(`inbox/${p.id}/requests`).get()).docs; rs.forEach(r=>all.push({path:`inbox/${p.id}/requests/${r.id}`,...r.data()})) }
    all.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    if(!all.length){ box.innerHTML=`<p class="muted">No requests yet. They appear here when a client sends a quote, booking or consult request.</p>`; return }
    box.innerHTML=`<table><thead><tr><th>When</th><th>Type</th><th>Client</th><th>Details</th><th>Status</th></tr></thead><tbody>${all.map(r=>{
      const skip=["kind","name","email","company","status","createdAt","path"]; const det=Object.entries(r).filter(([k,x])=>!skip.includes(k)&&x!==""&&x!=null&&x!==false).map(([k,x])=>`<b>${esc(k)}</b>: ${esc(x)}`).join("<br>");
      return `<tr><td class="mono">${esc((r.createdAt||"").slice(0,16).replace("T"," "))}</td><td>${esc(r.kind)}</td><td>${esc(r.name)}<br><span class="muted mono">${esc(r.email)}</span><br>${esc(r.company)}</td><td style="min-width:220px">${det}</td>
        <td><select data-p="${esc(r.path)}">${["new","contacted","booked","won","closed"].map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>` }).join("")}</tbody></table>`;
    box.onchange=async e=>{ const s=e.target.closest("select[data-p]"); if(!s) return; try{ await cap.db.doc(s.dataset.p).update({status:s.value}); toast("Status updated") }catch{ toast("Couldn't update status") } };
  }catch(e){ box.innerHTML=`<p style="color:var(--bad)">Couldn't load requests: ${esc(e.message||e.code||"")}</p>` }
};

show(current);
</script>
