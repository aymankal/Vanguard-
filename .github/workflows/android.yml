# Builds the Scout Desk Android app (android/) and publishes the APK as a GitHub release.
# The Client Hub app is separate: see client-android.yml.
# Download link that always points at the newest build:
#   https://github.com/aymankal/Vanguard-/releases/latest/download/ScoutDesk.apk
name: Android app
on:
  push:
    branches: [claude/crm-note-taker-improvements-3hw1c6]
    paths: [android/**, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Without a release key, Android's debug key signs the APK. Keep that key between runs so
      # each build still installs over the last one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: scout-desk-debug-keystore
      # Signing key from repo secrets, so every build installs over the last one. Secrets:
      # SCOUT_DESK_KEYSTORE_BASE64, SCOUT_DESK_KEYSTORE_PASSWORD, SCOUT_DESK_KEY_ALIAS, SCOUT_DESK_KEY_PASSWORD.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCOUT_DESK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scoutdesk.keystore"
            echo "SCOUT_DESK_KEYSTORE_PATH=$RUNNER_TEMP/scoutdesk.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No SCOUT_DESK_KEYSTORE_BASE64 secret. Signing with the cached debug key; add a release key before publishing to the Play Store."
          fi
      - name: Build signed APK
        working-directory: android
        env:
          SCOUT_DESK_KEYSTORE_PASSWORD: ${{ secrets.SCOUT_DESK_KEYSTORE_PASSWORD }}
          SCOUT_DESK_KEY_ALIAS: ${{ secrets.SCOUT_DESK_KEY_ALIAS }}
          SCOUT_DESK_KEY_PASSWORD: ${{ secrets.SCOUT_DESK_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ScoutDesk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScoutDesk-${{ github.run_number }}
          path: ScoutDesk.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scout-desk-android-${{ github.run_number }}
          name: Scout Desk for Android (build ${{ github.run_number }})
          body: |
            Install on Android: download ScoutDesk.apk on the phone, open it, and allow installs from your browser if asked.
            Each build installs over the previous one; your sign-in is kept.
          files: ScoutDesk.apk
          make_latest: true
