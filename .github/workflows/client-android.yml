# Builds the Vanguard Client Hub Android app (android-client/). Separate from the Scout Desk app.
# Each build replaces the APK on one fixed release, so this link always has the newest build:
#   https://github.com/aymankal/Vanguard-/releases/download/vanguard-client-android/VanguardClient.apk
# It never becomes the repo's "latest" release, so the Scout Desk link is unaffected.
name: Client Hub Android app
on:
  push:
    branches: [claude/crm-note-taker-improvements-3hw1c6]
    paths: [android-client/**, .github/workflows/client-android.yml]
  pull_request:
    paths: [android-client/**, .github/workflows/client-android.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: client-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Without a release key, Android's debug key signs the APK. Keep that key between runs so
      # each build still installs over the last one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vanguard-client-debug-keystore
      # Signing key from repo secrets, so every build installs over the last one. Secrets:
      # VANGUARD_CLIENT_KEYSTORE_BASE64, VANGUARD_CLIENT_KEYSTORE_PASSWORD, VANGUARD_CLIENT_KEY_ALIAS, VANGUARD_CLIENT_KEY_PASSWORD.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VANGUARD_CLIENT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vanguard-client.keystore"
            echo "VANGUARD_CLIENT_KEYSTORE_PATH=$RUNNER_TEMP/vanguard-client.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No VANGUARD_CLIENT_KEYSTORE_BASE64 secret. Signing with the cached debug key; add a release key before publishing to the Play Store."
          fi
      - name: Build signed APK
        working-directory: android-client
        env:
          VANGUARD_CLIENT_KEYSTORE_PASSWORD: ${{ secrets.VANGUARD_CLIENT_KEYSTORE_PASSWORD }}
          VANGUARD_CLIENT_KEY_ALIAS: ${{ secrets.VANGUARD_CLIENT_KEY_ALIAS }}
          VANGUARD_CLIENT_KEY_PASSWORD: ${{ secrets.VANGUARD_CLIENT_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Name the APK
        run: cp android-client/app/build/outputs/apk/release/app-release.apk VanguardClient.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VanguardClient-${{ github.run_number }}
          path: VanguardClient.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vanguard-client-android
          name: Vanguard Client Hub for Android
          body: |
            The Vanguard Client Hub app for clients (latest build ${{ github.run_number }}).
            Install on Android: download VanguardClient.apk on the phone, open it, and allow installs from your browser if asked.
            Each build installs over the previous one; your sign-in is kept.
          files: VanguardClient.apk
          make_latest: false
