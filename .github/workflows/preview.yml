# Publishes the app (the web/ folder) as a live preview on GitHub Pages,
# with the client onboarding app (onboarding/) at /onboarding/ and the Scout Desk app (scout-desk/) at /scout-desk/.
# It talks to the same Supabase project as the real site, so sign-in and data are real.
name: Preview
on:
  push:
    branches: [claude/crm-note-taker-improvements-3hw1c6]
    paths: [web/**, onboarding/**, scout-desk/**, .github/workflows/preview.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r onboarding _site/onboarding
          cp -r scout-desk _site/scout-desk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
