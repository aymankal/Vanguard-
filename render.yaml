# One-click deploy: Render dashboard → New → Blueprint → pick this repository → Apply.
services:
  - type: web
    name: vanguard-docs
    runtime: python
    # Starter (~$7/mo) + 5 GB disk (~$1.25/mo) keeps the register and every uploaded file
    # across restarts and deploys. Raise sizeGB in the dashboard as the archive grows.
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /healthz
    disk:
      name: docs-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_DATA_DIR
        value: /data
      - key: APP_USERNAME
        value: vanguard
      # Random passwords generated by Render: copy them from the Environment tab.
      - key: APP_PASSWORD
        generateValue: true
      # Second passcode for the Case File. Delete it to switch the Case File off.
      - key: CASE_PASSWORD
        generateValue: true
