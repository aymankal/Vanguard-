# One-click deploy: Render dashboard → New → Blueprint → pick this repository → Apply.
# A free static site: the database, sign-in and files all live in Supabase.
services:
  - type: web
    name: vanguard-docs
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://awmeixsvltzdspwnamyf.supabase.co; connect-src 'self' https://awmeixsvltzdspwnamyf.supabase.co wss://awmeixsvltzdspwnamyf.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
  # Client onboarding app (onboarding/). Intakes are emailed through FormSubmit.
  - type: web
    name: vanguard-onboarding
    runtime: static
    buildCommand: ""
    staticPublishPath: ./onboarding
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
  # Scout Desk app (scout-desk/): home-screen launcher and About page for Vanguard Frontier.
  - type: web
    name: vanguard-scout-desk
    runtime: static
    buildCommand: ""
    staticPublishPath: ./scout-desk
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
