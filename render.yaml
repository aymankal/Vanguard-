# One-click deploy: Render dashboard → New → Blueprint → pick this repository → Apply.
services:
  - type: web
    name: vanguard-crm
    runtime: python
    # Starter (~$7/mo) + 1 GB disk (~$0.25/mo) keeps data across restarts and deploys.
    # On the free plan the database resets on every restart — fine for demos only.
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /healthz
    disk:
      name: crm-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CRM_DB_PATH
        value: /data/crm.db
      - key: CRM_USERNAME
        value: vanguard
      # Random password generated by Render: copy it from the Environment tab.
      - key: CRM_PASSWORD
        generateValue: true
      # "false" = start with an empty CRM instead of sample data.
      - key: CRM_SEED_DEMO
        value: "true"
      # Optional: paste a key to power Copilot and note summaries with Claude.
      - key: ANTHROPIC_API_KEY
        sync: false
