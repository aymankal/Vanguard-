# One-click deploy: Render dashboard → New → Blueprint → pick this repository → Apply.
# A free static site: the database, sign-in and files all live in Supabase.
services:
  - type: web
    name: vanguard-docs
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://awmeixsvltzdspwnamyf.supabase.co; connect-src 'self' https://awmeixsvltzdspwnamyf.supabase.co wss://awmeixsvltzdspwnamyf.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
